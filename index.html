</style></head><body><div class="app"><div class="scrim" id="scrim" onclick="toggleMenu(false)"></div><aside class="sidebar" id="sidebar"><div class="brand"><span class="brandmark">t.</span>TicketFlow</div><div class="side-label">KƏŞF ET</div><nav id="mainNav"></nav><div class="side-label">ŞƏXSİ KABİNET</div><nav id="accountNav"></nav><div class="side-bottom"><button class="side-btn" onclick="navigate('faq')" id="helpNav"></button><button class="side-btn" onclick="handleLogout()" id="logoutNav"></button><div class="user-mini" id="miniUser"></div></div></aside><main class="main"><header class="topbar"><button class="iconbtn mobile-menu" aria-label="Menyunu aç" onclick="toggleMenu(true)" id="menuButton"></button><div class="mobile-title">TicketFlow</div><label class="search" id="topSearch"></label><div class="top-actions"><button class="iconbtn hide-mobile" title="Sevimlilər" onclick="navigate('favorites')" id="favTop"></button><button class="iconbtn" title="Səbət" onclick="openCart()" id="cartTop"></button><button class="btn primary hide-mobile" id="authTop" onclick="openAuth('login')">Daxil ol</button></div></header><div class="content" id="view"></div></main></div><div class="modal-wrap" id="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div><div class="toast" id="toast" role="status"></div><script>
const icons={home:'house',events:'calendar-days',orders:'shopping-bag',tickets:'ticket',profile:'user-round',favorites:'heart',password:'lock-keyhole',faq:'circle-help',logout:'log-out',search:'search',menu:'menu',cart:'shopping-cart',calendar:'calendar-days',pin:'map-pin',clock:'clock-3',check:'check-circle-2',close:'x',plus:'plus',minus:'minus',back:'arrow-left',copy:'copy',upload:'upload-cloud',info:'info',mail:'mail',phone:'phone',shield:'shield-check',bell:'bell',arrow:'arrow-right',trash:'trash-2',credit:'credit-card',gift:'gift',transfer:'arrow-left-right',wallet:'wallet',refund:'rotate-ccw',eye:'eye',filter:'sliders-horizontal'};

7',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7 M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6','sliders-horizontal':'M3 6h18 M3 18h18 M8 3v6 M16 15v6'};
function ico(name){return `<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[icons[name]||name]||paths.info}"/></svg>`}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let page='home',category='Hamısı',filterText='',orderFilter='Hamısı',ticketFilter='Gələcək',qty=1,selectedEvent=null,cart=null,modalTimer=null;
let users=[],session=null,favorites={};
const imageFor=e=>e?.posterImage||'assets/'+(e.poster||({'EV-101':'halloween','EV-102':'autumn','EV-103':'treasure','EV-104':'school'}[e.id])||['halloween','autumn','treasure','school'][Math.abs([...e.id].reduce((a,c)=>a+c.charCodeAt(0),0))%4])+'.svg';let cloud={events:[],orders:[],expenses:[],tickets:[]};function db(){return cloud}function writeDb(d){throw Error('Yalnız Firebase yazma əməliyyatları dəstəklənir')}function events(){return cloud.events}function me(){return users.find(u=>u.id===session?.id)}function myOrders(){return cloud.orders.filter(o=>o.userId===session?.id).sort((a,b)=>b.createdAt-a.createdAt)}function date(e){try{return new Date(e.date+'T12:00:00').toLocaleDateString('az-AZ',{day:'2-digit',month:'2-digit',year:'numeric'})}catch{return e.date}}function money(n){return Number(n||0).toFixed(2)+' ₼'}function remaining(e){return Math.max(0,Number(e.capacity||0)-Number(e.sold||0)-Object.values(e.holds||{}).filter(h=>h.expiresAt>Date.now()).reduce((a,h)=>a+Number(h.qty||0),0))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>x.style.display='none',3300)}function toggleMenu(show){document.getElementById('sidebar').classList.toggle('open',show);document.getElementById('scrim').classList.toggle('show',show)}function navButton(label,id,icon){return `<button class="side-btn ${page===id?'active':''}" onclick="navigate('${id}')">${ico(icon)} ${label}</button>`}function shell(){document.getElementById('mainNav').innerHTML=navButton('Əsas səhifə','home','home')+navButton('Bütün tədbirlər','events','events')+navButton('Sevimlilər','favorites','favorites');document.getElementById('accountNav').innerHTML=navButton('Şəxsi kabinet','dashboard','profile')+navButton('Sifarişlərim','orders','orders')+navButton('Biletlərim','tickets','tickets')+navButton('Hesab məlumatları','profile','profile')+navButton('Şifrəni dəyiş','password','password');document.getElementById('helpNav').innerHTML=ico('faq')+' Kömək və FAQ';document.getElementById('logoutNav').innerHTML=ico('logout')+(session?' Çıxış':' Daxil ol / Qeydiyyat');document.getElementById('miniUser').innerHTML=`<div class="avatar">${esc((me()?.name||'Q')[0].toUpperCase())}</div><div style="min-width:0"><b>${esc(me()?.name||'Qonaq istifadəçi')}</b><div class="muted tiny" style="overflow:hidden;text-overflow:ellipsis">${esc(me()?.email||'Hesabınıza daxil olun')}</div></div>`;document.getElementById('menuButton').innerHTML=ico('menu');document.getElementById('favTop').innerHTML=ico('favorites');document.getElementById('cartTop').innerHTML=ico('cart')+(cart?'<span style="color:#b58900">●</span>':'');document.getElementById('topSearch').innerHTML=ico('search')+`<input id="globalSearch" placeholder="Tədbir, məkan axtarın..." value="${esc(filterText)}" oninput="filterText=this.value;if(page!=='events')navigate('events',false);else render()">`;document.getElementById('authTop').textContent=session?'Hesabım':'Daxil ol';document.getElementById('authTop').onclick=()=>session?navigate('dashboard'):openAuth('login')}
function navigate(next,scroll=true){toggleMenu(false);if(['dashboard','orders','tickets','profile','password'].includes(next)&&!session){openAuth('login');return}page=next;shell();render();if(scroll)window.scrollTo({top:0,behavior:'instant'})}function title(h,sub=''){return `<div class="heading"><div><h1>${h}</h1>${sub?`<p>${sub}</p>`:''}</div></div>`}function status(o){if(o.status==='Gözləyir'&&o.expiresAt<Date.now())return 'Müddəti bitib';return o.status}function statusBadge(s){return `<span class="badge ${s==='Təsdiqlənib'?'ok':s==='Gözləyir'?'warn':'bad'}">${esc(s)}</span>`}function eventCard(e){let available=remaining(e),active=e.status==='Satışda'&&available>0;return `<article class="event-card"><div class="poster"><img src="${imageFor(e)}" alt="${esc(e.name)} afişası"><button class="heart ${favorites[session?.id]?.includes(e.id)?'saved':''}" title="Sevimlilərə əlavə et" onclick="toggleFavorite('${e.id}')">${ico('favorites')}</button></div><div class="event-body"><div class="eyebrow">${esc(e.category||'Tədbir')}</div><h3>${esc(e.name)}</h3><div class="meta">${ico('calendar')} ${date(e)} · ${esc(e.time||'')}</div><div class="meta">${ico('pin')} ${esc(e.venue)}</div><div class="event-foot"><div><div class="price">${money(e.price)}</div><small class="muted">${active?available+' yer qalıb':'Yerlər doludur / satış bitib'}</small></div><button class="btn primary" onclick="openEvent('${e.id}')">Ətraflı ${ico('arrow')}</button></div></div></article>`}function filteredEvents(){return events().filter(e=>(category==='Hamısı'||(e.category||'Tədbir')===category)&&(e.name+' '+e.venue).toLocaleLowerCase('az').includes(filterText.toLocaleLowerCase('az')))}function eventGrid(list){return list.length?`<div class="grid-events">${list.map(eventCard).join('')}</div>`:empty('Uyğun tədbir tapılmadı','Axtarışı və ya filtrləri dəyişin.')}function categoryBar(){const cats=['Hamısı',...new Set(events().map(e=>e.category||'Tədbir'))];return `<div class="pills">${cats.map(c=>`<button class="pill ${category===c?'active':''}" onclick="category=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${esc(c)}</button>`).join('')}</div>`}function home(){const e=events().find(x=>x.featured==='yes')||events().find(x=>x.status==='Satışda')||events()[0];if(!e)return title('Tədbirləri kəşf et','Yeni tədbirlər yükləndikdə burada görünəcək.')+'<div class="card">Hələ tədbir yoxdur və ya Firebase məlumatları yüklənir.</div>';return `<div class="heading"><div><div class="eyebrow">Kəşf et • yaşa • xatırla</div><h1>Unudulmaz anlar buradan başlayır</h1><p>Ən maraqlı tədbirləri kəşf et və biletini rahatlıqla əldə et.</p></div></div><div class="hero"><div class="hero-main"><img src="${e.heroImage||imageFor(e)}" alt="Tədbir afişası"><div class="hero-copy"><div><div class="eyebrow" style="color:#ffe76c">Seçilmiş tədbir</div><h2>${esc(e.name)}</h2><p>${date(e)} · ${esc(e.venue)}</p></div><button class="btn primary" onclick="openEvent('${e.id}')">Bilet al ${ico('arrow')}</button></div></div><div class="hero-side" style="${e.specialImage?'background-image:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.45)),url('+e.specialImage+');background-position:center;background-size:cover;color:white':''}"><div><div class="eyebrow">TicketFlow xüsusi</div><h3>Hər bilet,<br>yeni bir hekayə.</h3><p>Sevdiyin tədbirləri tap, biletini seç və xatirələrini yarat.</p></div><button class="btn" onclick="navigate('events')">Bütün tədbirlər ${ico('arrow')}</button></div></div>${categoryBar()}<div class="section-title"><h2>Populyar tədbirlər</h2><button class="link" onclick="navigate('events')">Hamısına bax →</button></div>${eventGrid(filteredEvents().slice(0,6))}`}
function listing(){return `${title('Bütün tədbirlər','Tədbirləri kateqoriya və ada görə axtarın.')}${categoryBar()}<div class="filters"><select onchange="window.eventSort=this.value;render()"><option value="soon">Ən yaxın tarix</option><option value="low" ${window.eventSort==='low'?'selected':''}>Ən ucuz</option><option value="high" ${window.eventSort==='high'?'selected':''}>Ən bahalı</option></select><button class="btn" onclick="filterText='';category='Hamısı';window.eventSort='soon';shell();render()">Filtrləri sıfırla</button></div>${eventGrid(filteredEvents().sort((a,b)=>window.eventSort==='low'?a.price-b.price:window.eventSort==='high'?b.price-a.price:a.date.localeCompare(b.date)))}`}
function empty(h,sub,action='Tədbirlərə bax'){return `<div class="empty">${ico('tickets')}<h3>${h}</h3><p>${sub}</p><button class="btn primary" onclick="navigate('events')">${action} ${ico('arrow')}</button></div>`}function dashboard(){let os=myOrders(),tickets=cloud.tickets.filter(t=>t.status==='active'&&!t.used).length;return `${title('Şəxsi kabinet','Xoş gəldin, '+esc(me()?.name||'')+'! Bütün biletlərini buradan idarə et.') }<div class="stats"><div class="card stat"><span>Sifarişlərim</span><strong>${os.length}</strong>${ico('orders')}</div><div class="card stat"><span>Aktiv biletlər</span><strong>${tickets}</strong>${ico('tickets')}</div><div class="card stat"><span>Gözləyən ödəniş</span><strong>${os.filter(o=>status(o)==='Gözləyir').length}</strong>${ico('clock')}</div></div><div class="section-title"><h2>Son sifarişlər</h2><button class="link" onclick="navigate('orders')">Hamısı →</button></div>${os.length?os.slice(0,3).map(orderCard).join(''):empty('Hələ sifariş yoxdur','İlk tədbirini seçərək başla.')}`}
function orderCard(o){let e=events().find(x=>x.id===o.eventId)||{id:o.eventId,name:o.eventName||'Tədbir',date:o.eventDate||'',time:o.eventTime||'',venue:o.venue||''},s=status(o);return `<div class="order-card" onclick="openOrder('${o.id}')"><div><div class="muted tiny">Sifariş № ${esc(o.id)}</div><h3>${esc(e?.name||'Tədbir')}</h3><p>${new Date(o.createdAt).toLocaleDateString('az-AZ')} · Biletlər: ${o.qty} · ${money(o.amount)}</p></div><div style="text-align:right">${statusBadge(s)}<p>Detallara bax →</p></div></div>`}function orders(){let os=myOrders(),tabs=['Hamısı','Təsdiqlənib','Gözləyir','Müddəti bitib','Rədd edilib'];let visible=os.filter(o=>orderFilter==='Hamısı'||status(o)===orderFilter);return `${title('Sifarişlərim','Sifarişlərin statusunu və ödənişlərini izləyin.')}<div class="tabs">${tabs.map(t=>`<button class="tab ${orderFilter===t?'active':''}" onclick="orderFilter='${t}';render()">${t}</button>`).join('')}</div>${visible.length?visible.map(orderCard).join(''):empty('Bu bölmədə sifariş yoxdur','Tədbirlər arasından seçim edə bilərsiniz.')}`}
function tickets(){
 const today=new Date().toLocaleDateString('en-CA');
 const arr=cloud.tickets.filter(t=>{
   const d=String(t.date||'');
   return ticketFilter==='Gələcək' ? (!d||d>=today) : (!!d&&d<today);
 }).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
 const pending=myOrders().filter(o=>o.status==='Gözləyir').length;
 const subtitle='Admin tərəfindən təsdiqlənmiş QR kodlu biletləriniz burada görünür.';
 return `${title('Biletlərim',subtitle)}<div class="tabs">${['Gələcək','Keçmiş'].map(t=>`<button class="tab ${ticketFilter===t?'active':''}" onclick="ticketFilter='${t}';render()">${t} tədbirlər</button>`).join('')}</div>${arr.length?arr.map(t=>`<div class="ticket-row tf-owned-ticket"><div class="tf-ticket-avatar">${ico('tickets')}</div><div class="grow"><h3>${esc(t.eventName||'Tədbir')}</h3><div class="muted tiny">${esc(t.date||'')} · ${esc(t.time||'')} · ${esc(t.venue||'')}</div><div class="muted tiny">Bilet № ${esc(t.ticketNumber||t.id)}</div><div class="muted tiny">${t.used?'<span class="badge bad">Giriş edilib</span>':'<span class="badge ok">Aktiv bilet</span>'}</div></div><button class="btn primary" onclick="openTicket('${esc(t.ticketNumber||t.id)}')">${ico('eye')} Biletə bax</button></div>`).join(''):empty('Bu bölmədə QR bilet yoxdur',pending?'Gözləyən sifarişiniz admin tərəfindən təsdiqləndikdən sonra burada görünəcək.':'Yeni bilet sifariş etdikdən və admin təsdiqlədikdən sonra burada görünəcək.')}`;
}
function favoritesPage(){let ids=favorites[session?.id]||[],list=events().filter(e=>ids.includes(e.id));return `${title('Sevimlilər','Bəyəndiyiniz tədbirləri bir yerdə saxlayın.')}${eventGrid(list)}`}
function profile(){let u=me();return `${title('Hesab məlumatları','Şəxsi məlumatlarınızı yeniləyin.')}<div class="card"><form id="profileForm" onsubmit="saveProfile(event)"><div class="form-grid"><div class="field"><label>İstifadəçi ID</label><input disabled value="${esc(u.id)}"></div><div class="field"><label>E-poçt</label><input disabled value="${esc(u.email)}"><small>E-poçt dəyişməsi Firebase qoşulduqda təsdiqləmə ilə işləyəcək.</small></div><div class="field"><label>Ad və soyad</label><input name="name" required value="${esc(u.name)}"></div><div class="field"><label>Telefon</label><input name="phone" type="tel" value="${esc(u.phone||'')}" placeholder="+994..."></div><div class="field"><label>Doğum tarixi</label><input name="birthday" type="date" value="${esc(u.birthday||'')}"></div><div class="field"><label>Ölkə</label><select name="country"><option>Azərbaycan</option><option ${u.country==='Digər'?'selected':''}>Digər</option></select></div></div><button class="btn primary" type="submit">Dəyişiklikləri yadda saxla</button></form></div>`}
function password(){return `${title('Şifrəni dəyiş','Hesabınızın təhlükəsizliyini qoruyun.')}<div class="card" style="max-width:570px"><form onsubmit="changePassword(event)"><div class="field"><label>Cari şifrə</label><input type="password" name="old" required></div><div class="field"><label>Yeni şifrə</label><input type="password" name="new" minlength="6" required></div><div class="field"><label>Yeni şifrəni təkrar yazın</label><input type="password" name="confirm" minlength="6" required></div><button class="btn primary" type="submit">${ico('shield')} Şifrəni yenilə</button></form></div>`}
const faqs=[['Necə qeydiyyatdan keçə bilərəm?','Hesab yarat düyməsinə basın, ad-soyad, e-poçt və şifrənizi daxil edin. Hesabınız Firebase Authentication ilə yaradılır.'],['Şifrəmi unutmuşam, nə etməliyəm?','Şifrənizi unutmusunuzsa, giriş ekranında şifrə bərpası üçün müraciət edin.'],['Bileti necə sifariş edə bilərəm?','Tədbiri seçin, bilet sayını müəyyən edin və sifariş yaradın.'],['Rezervasiya nə qədər davam edir?','Sifariş yaradıldıqdan sonra 30 dəqiqə ərzində ödəniş qəbzini göndərmək nəzərdə tutulur.'],['Ödənişi necə həyata keçirə bilərəm?','Göstərilən kart məlumatlarına bank tətbiqinizdən köçürmə edib qəbzi əlavə edirsiniz. Ödənişdən əvvəl kart məlumatlarını yoxlayın.'],['Bilet nə zaman aktivləşir?','Admin ödənişi bank hesabında yoxlayıb təsdiqlədikdən sonra sifarişin biletləri aktiv olur.'],['Qəbz göndərmək ödəniş təsdiqidir?','Xeyr. Qəbz yalnız yoxlama üçün göndərilir; ödənişi admin təsdiqləyir.'],['Biletimi necə görə bilərəm?','Şəxsi kabinetin Biletlərim bölməsində təsdiqlənmiş biletlərə baxın.']];function faq(){return `${title('Tez-tez verilən suallar','Sifariş və biletlərlə bağlı cavabları burada tapın.')}<div style="max-width:720px;margin:20px auto"><label class="search" style="max-width:none;margin-bottom:22px">${ico('search')}<input placeholder="Suallar arasında axtar..." oninput="document.querySelectorAll('.faq-item').forEach(x=>x.hidden=!x.textContent.toLocaleLowerCase('az').includes(this.value.toLocaleLowerCase('az')))"></label>${faqs.map(([q,a],i)=>`<div class="faq-item"><button onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><span style="color:#b18b00">${String(i+1).padStart(2,'0')}</span> ${q}<span>⌄</span></button><p hidden>${a}</p></div>`).join('')}</div>`}
function render(){document.getElementById('view').classList.toggle('home-view',page==='home');const views={home,events:listing,dashboard,orders,tickets,favorites:favoritesPage,profile,password,faq};document.getElementById('view').innerHTML=(views[page]||home)()}

function openEvent(id){selectedEvent=id;qty=1;page='detail';shell();renderDetail();window.scrollTo(0,0)}function renderDetail(){let e=events().find(x=>x.id===selectedEvent);if(!e){navigate('events');return}let n=remaining(e),can=e.status==='Satışda'&&n>0;document.getElementById('view').innerHTML=`<button class="btn ghost" onclick="navigate('events')">${ico('back')} Tədbirlərə qayıt</button><div style="height:15px"></div><div class="detail-hero"><img src="${e.detailImage||imageFor(e)}" alt="${esc(e.name)} afişası"><div class="detail-copy"><span class="eyebrow" style="color:#ffe36e">${esc(e.category||'Tədbir')}</span><h1>${esc(e.name)}</h1><div>${date(e)} · ${esc(e.time)} · ${esc(e.venue)}</div></div></div><div class="detail-columns"><div><div class="card"><h3>Tədbir haqqında</h3><p style="line-height:1.8;color:var(--muted)">${esc(e.description||'Sizi unudulmaz anlarla dolu maraqlı bir tədbir gözləyir. Ətraflı proqram məlumatları təşkilatçı tərəfindən əlavə ediləcək.')}</p><div class="divider"></div><h3>İştirak qaydaları</h3><p class="muted">Bilet yalnız ödəniş admin tərəfindən təsdiqləndikdən sonra aktiv olur. Giriş üçün təsdiqlənmiş elektron bileti təqdim edin.</p><div class="divider"></div><h3>Məkan</h3><div class="meta">${ico('pin')} ${esc(e.venue)}</div></div><div class="section-title"><h2>Oxşar tədbirlər</h2></div>${eventGrid(events().filter(x=>x.id!==e.id).slice(0,2))}</div><div><div class="card" style="position:sticky;top:95px"><div class="eyebrow">Bilet seçimi</div><h3>${money(e.price)} <span class="muted tiny">/ 1 bilet</span></h3><div class="meta">${ico('calendar')} ${date(e)} · ${esc(e.time)}</div><div class="meta">${ico('pin')} ${esc(e.venue)}</div><div class="divider"></div><div style="display:flex;justify-content:space-between;align-items:center"><b>Bilet sayı</b><div class="qty"><button onclick="qty=Math.max(1,qty-1);renderDetail()">−</button><strong>${qty}</strong><button onclick="qty=Math.min(${Math.min(n,10)},qty+1);renderDetail()" ${!can||qty>=Math.min(n,10)?'disabled':''}>+</button></div></div><div class="divider"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><span>Ümumi məbləğ</span><strong style="font-size:23px">${money(e.price*qty)}</strong></div><button class="btn primary full" ${can?'':'disabled'} onclick="addCart('${e.id}')">${ico('cart')} ${can?'Səbətə əlavə et':'Yerlər doludur'}</button><p class="muted tiny" style="text-align:center">${can?n+' boş yer mövcuddur':'Bu tədbirə bilet satışı aktiv deyil.'}</p></div></div></div>`}
function addCart(id){let e=events().find(x=>x.id===id);if(remaining(e)<qty){toast('Kifayət qədər boş yer yoxdur');return}cart={eventId:id,qty};openCart();shell()}function openCart(){if(!cart){toast('Səbətiniz boşdur');return}let e=events().find(x=>x.id===cart.eventId);if(!e)return;let u=me();showModal('Səbət və sifariş',`<div class="checkout-grid"><div class="card"><div class="eyebrow">Seçilmiş tədbir</div><div class="ticket-row"><img src="${imageFor(e)}"><div><h3>${esc(e.name)}</h3><div class="muted tiny">${date(e)} · ${esc(e.time)}</div><div class="muted tiny">${esc(e.venue)}</div></div></div><div class="divider"></div><div style="display:flex;justify-content:space-between"><b>Bilet sayı</b><div class="qty"><button onclick="cart.qty=Math.max(1,cart.qty-1);openCart()">−</button><b>${cart.qty}</b><button onclick="cart.qty=Math.min(10,cart.qty+1);openCart()">+</button></div></div><div class="divider"></div><div class="muted">${u?`Alıcı: ${esc(u.name)} · ${esc(u.email)}`:'Sifarişi davam etdirmək üçün hesaba daxil olun.'}</div><button class="btn danger" style="margin-top:16px" onclick="cart=null;closeModal();shell();toast('Səbət təmizləndi')">${ico('trash')} Səbəti təmizlə</button></div><div class="card"><h3>Sifariş yekunu</h3><div style="display:flex;justify-content:space-between;margin:18px 0"><span>${cart.qty} bilet</span><b>${money(cart.qty*e.price)}</b></div><div class="divider"></div><div style="display:flex;justify-content:space-between"><b>Toplam</b><strong style="font-size:24px">${money(cart.qty*e.price)}</strong></div><p class="alert">Sifariş yaradıldıqdan sonra 30 dəqiqə ərzində kartdan-karta ödəniş edib qəbzi göndərin.</p><label style="display:flex;gap:9px;align-items:start;margin:15px 0"><input type="checkbox" id="termsCheck"> <span>Rezervasiya və ödəniş qaydalarını qəbul edirəm.</span></label><button class="btn primary full" onclick="createOrder()">Sifarişi yarat ${ico('arrow')}</button></div></div>`,true)}async function createOrder(){
 if(!session){closeModal();openAuth('login');return}
 if(!document.getElementById('termsCheck')?.checked)return toast('Qaydaları qəbul edin');
 if(!cart)return toast('Səbət boşdur');
 try{const o=await window.TF.reserve(cart.eventId,cart.qty,me());cart=null;closeModal();shell();navigate('orders');setTimeout(()=>openOrder(o.id),250);toast('30 dəqiqəlik rezervasiya yaradıldı')}catch(e){toast(window.TF.error(e))}
}
function openOrder(id){let o=myOrders().find(x=>x.id===id);if(!o)return;let e=events().find(x=>x.id===o.eventId)||{id:o.eventId,name:o.eventName||'Tədbir',date:o.eventDate||'',time:o.eventTime||'',venue:o.venue||''},s=status(o),left=Math.max(0,o.expiresAt-Date.now());showModal('Sifariş '+esc(o.id),`<div class="checkout-grid"><div><div class="card"><div class="eyebrow">Tədbir məlumatları</div><div class="ticket-row"><img src="${imageFor(e)}"><div><h3>${esc(e.name)}</h3><div class="muted tiny">${date(e)} · ${esc(e.time)}</div><div class="muted tiny">${esc(e.venue)}</div></div></div><div class="divider"></div><p><b>Sifariş statusu:</b> ${statusBadge(s)}</p><p><b>Bilet sayı:</b> ${o.qty}</p><p><b>Yekun məbləğ:</b> ${money(o.amount)}</p>${s==='Gözləyir'?`<p class="timer" id="countdown">Qalan vaxt: ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</p><div class="divider"></div><h3>Kartdan-karta ödəniş</h3><p class="muted tiny">Ödəniş etməzdən əvvəl kart sahibinin adını və nömrəni yoxlayın.</p><div class="card payment-card"><div class="payment-card-info"><div class="muted tiny">Kartdan-karta ödəniş</div><b>${esc(window.TF?.cardNumber||"Kart məlumatı admin tərəfindən daxil edilməyib")}</b></div><button type="button" class="btn payment-copy" aria-label="Kart məlumatını kopyala" title="Kopyala" onclick="navigator.clipboard?.writeText(window.TF?.cardNumber||'');toast('Kart məlumatı kopyalandı')">${ico('copy')}</button></div><div class="divider"></div><div class="field receipt-field"><b>Ödəniş qəbzi</b><div class="receipt receipt-compact"><span class="receipt-symbol">${ico('upload')}</span><div class="receipt-description"><strong>Qəbzi əlavə et</strong><small>JPG, PNG və ya WebP · maksimum 5 MB</small><span id="receiptFileName" class="receipt-filename"></span></div><label class="btn receipt-picker" for="receiptInput">Fayl seç</label><input type="file" id="receiptInput" accept="image/png,image/jpeg,image/webp" onchange="document.getElementById('receiptFileName').textContent=this.files?.[0]?.name||''"></div></div><button class="btn primary full" onclick="submitReceipt('${o.id}')">Qəbzi yoxlamaya göndər</button><p class="alert">Qəbz göndərilməsi ödənişin təsdiqi deyil. Admin bank hesabını yoxlamalıdır.</p>`:s==='Təsdiqlənib'?`<div class="alert" style="background:#e7f8ee;color:#087750">${ico('check')} Ödəniş təsdiqlənib. QR kodlu biletiniz hazırdır.</div>${cloud.tickets.filter(t=>t.orderId===o.id).map(t=>`<div class="ticket-row"><div class="grow"><b>${esc(t.ticketNumber||t.id)}</b><div class="muted tiny">${t.used?'Giriş edilib':'Elektron QR bilet aktivdir'}</div></div><button class="btn primary" onclick="openTicket('${esc(t.ticketNumber||t.id)}')">${ico('eye')} Bileti aç</button></div>`).join('')||'<p class="muted tiny">Bilet məlumatları yüklənir. Bir neçə saniyədən sonra “Biletlərim” bölməsində yoxlayın.</p>'}`:`<p class="alert">Bu sifarişin statusu: ${esc(s)}. Yeni sifariş yaratmaq üçün tədbirlərə baxın.</p>`}</div></div><div><div class="card"><h3>Sifariş yekunu</h3><p class="muted">Sifariş № <b>${esc(o.id)}</b></p><p class="muted">Tarix: ${new Date(o.createdAt).toLocaleString('az-AZ')}</p><div class="divider"></div><div style="display:flex;justify-content:space-between"><span>Bilet × ${o.qty}</span><b>${money(o.amount)}</b></div><div class="divider"></div><div style="display:flex;justify-content:space-between"><b>Toplam</b><strong>${money(o.amount)}</strong></div>${s==='Gözləyir'?`<button class="btn danger full" style="margin-top:22px" onclick="cancelOrder('${o.id}')">Sifarişi ləğv et</button>`:''}</div></div></div>`,true);document.getElementById('modal').classList.add('order-modal');if(s==='Gözləyir'){clearInterval(modalTimer);modalTimer=setInterval(()=>{let x=document.getElementById('countdown');if(!x){clearInterval(modalTimer);return}let diff=Math.max(0,o.expiresAt-Date.now());x.textContent='Qalan vaxt: '+Math.floor(diff/60000)+':'+String(Math.floor(diff/1000)%60).padStart(2,'0');if(!diff){clearInterval(modalTimer);closeModal();navigate('orders');toast('Rezervasiya müddəti bitdi')}},1000)}}function copyTicket(t){if(navigator.clipboard)navigator.clipboard.writeText(t);toast('Bilet identifikatoru kopyalandı')}async function cancelOrder(id){try{await window.TF.cancel(id);closeModal();navigate('orders');toast('Sifariş ləğv edildi')}catch(e){toast(window.TF.error(e))}}
async function submitReceipt(id){const file=document.getElementById('receiptInput')?.files?.[0];if(!file)return toast('Qəbz şəklini seçin');try{await window.TF.receipt(id,file);closeModal();navigate('orders');toast('Qəbz yoxlamaya göndərildi')}catch(e){toast(window.TF.error(e))}}
function ownedTicket(ticketNumber){
 return cloud.tickets.find(t=>(t.ticketNumber||t.id)===ticketNumber && t.buyerUid===session?.id);
}
let previewTicketNumber=null;
async function openTicket(ticketNumber){
 if(!session)return openAuth('login');
 const t=ownedTicket(ticketNumber);if(!t){toast('Bilet tapılmadı və ya sizə aid deyil.');return;}
 if(!t.qrToken){toast('Bu bilet üçün QR kod yaradılmayıb.');return;}
 previewTicketNumber=t.ticketNumber||t.id;
 showModal('Elektron bilet · '+esc(previewTicketNumber),`<div class="tf-ticket-preview"><div class="alert" style="margin-bottom:12px">${t.used?'Bu bilet artıq girişdə istifadə edilib.':'Bu QR kodu yalnız tədbir girişində göstərin. QR yalnız bir dəfə keçərlidir.'}</div><div id="tfUserTicketCanvas" class="tf-ticket-canvas">Bilet hazırlanır…</div><div class="tf-ticket-actions"><button class="btn primary" onclick="downloadTicket()">${ico('upload')} PNG yüklə</button><button class="btn" onclick="printTicket()">Çap et</button></div></div>`,false);
 try{
   if(!window.TFTicketRenderer)throw Error('Bilet renderer modulu yüklənməyib.');
   const canvas=await window.TFTicketRenderer.render(t,{template:window.TF?.ticketTemplate||'assets/ticket.jpg'});
   const target=document.getElementById('tfUserTicketCanvas');if(target)target.replaceChildren(canvas);
 }catch(e){const target=document.getElementById('tfUserTicketCanvas');if(target)target.textContent='Bilet hazırlana bilmədi: '+e.message;}
}
async function downloadTicket(){
 const can=document.querySelector('#tfUserTicketCanvas canvas');if(!can)return toast('Bilet hazırlanmayıb.');
 const blob=await new Promise(resolve=>can.toBlob(resolve,'image/png'));
 if(!blob)return toast('Şəkil hazırlana bilmədi.');
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=(previewTicketNumber||'bilet').replace(/[^a-zA-Z0-9_-]/g,'-')+'.png';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function printTicket(){
 const can=document.querySelector('#tfUserTicketCanvas canvas');if(!can)return toast('Bilet hazırlanmayıb.');
 const win=window.open('','_blank');if(!win)return toast('Çap pəncərəsinə icazə verin.');
 const img=can.toDataURL('image/png');
 win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Biletin çapı</title><style>body{margin:0;text-align:center}img{width:auto;max-width:100%;max-height:100vh}@media print{@page{margin:8mm}}</style></head><body><img src="'+img+'" onload="window.print()"></body></html>');
 win.document.close();
}
function showModal(h,body,wide=false){clearInterval(modalTimer);let el=document.getElementById('modal');el.className='modal'+(wide?' wide':'');el.innerHTML=`<div class="modal-head"><h2>${h}</h2><button class="iconbtn" aria-label="Bağla" onclick="closeModal()">${ico('close')}</button></div>${body}`;document.getElementById('modalWrap').classList.add('show')}function closeModal(){clearInterval(modalTimer);document.getElementById('modalWrap').classList.remove('show')}function openAuth(mode){showModal(mode==='register'?'Hesab yarat':'Hesaba daxil ol',`<form id="authForm" onsubmit="authSubmit(event,'${mode}')">${mode==='register'?'<div class="field"><label>Ad və soyad</label><input name="name" minlength="3" required autocomplete="name"></div>':''}<div class="field"><label>E-poçt</label><input type="email" name="email" required autocomplete="email"></div><div class="field"><label>Şifrə</label><input type="password" name="password" minlength="6" required autocomplete="${mode==='register'?'new-password':'current-password'}"></div>${mode==='register'?'<div class="field"><label>Şifrəni təkrar yazın</label><input type="password" name="confirm" minlength="6" required autocomplete="new-password"></div>':''}<button class="btn primary full" type="submit">${mode==='register'?'Hesab yarat':'Daxil ol'}</button><p style="text-align:center">${mode==='register'?'Hesabınız var?':'Hesabınız yoxdur?'} <button type="button" class="link" onclick="openAuth('${mode==='register'?'login':'register'}')">${mode==='register'?'Daxil ol':'Qeydiyyatdan keç'}</button></p><p class="muted tiny">Qeydiyyat Firebase Authentication ilə qorunur.</p>${mode==='login'?'<button type="button" class="link" onclick="requestPasswordReset()">Şifrəmi unutmuşam</button>':''}</form>`)}async function authSubmit(ev,mode){ev.preventDefault();const f=new FormData(ev.target);if(mode==='register'&&f.get('password')!==f.get('confirm'))return toast('Şifrələr uyğun gəlmir');try{await window.TF.login(mode,String(f.get('email')).trim(),String(f.get('password')),String(f.get('name')||'').trim());closeModal();navigate('dashboard');toast('Xoş gəlmisiniz!')}catch(e){toast(window.TF.error(e))}}
async function requestPasswordReset(){const email=window.prompt('Şifrə bərpası üçün e-poçt ünvanını daxil edin:');if(!email)return;try{await window.TF.resetPassword(email.trim());toast('Şifrə bərpası üçün məktub göndərildi.')}catch(e){toast(window.TF.error(e))}}
async function handleLogout(){if(!session)return openAuth('login');await window.TF.logout();navigate('home')}
async function saveProfile(ev){ev.preventDefault();try{await window.TF.profile(Object.fromEntries(new FormData(ev.target)));toast('Məlumatlar yeniləndi')}catch(e){toast(window.TF.error(e))}}
async function changePassword(ev){ev.preventDefault();let f=new FormData(ev.target);if(f.get('new')!==f.get('confirm'))return toast('Şifrələr uyğun gəlmir');try{await window.TF.password(f.get('old'),f.get('new'));ev.target.reset();toast('Şifrə yeniləndi')}catch(e){toast(window.TF.error(e))}}
window.TFUserUpdate=function(delta){
 if(Object.prototype.hasOwnProperty.call(delta,'profile')){
   users=delta.profile?[delta.profile]:[];
   session=delta.profile?{id:delta.profile.id}:null;
   if(!session&&['dashboard','orders','tickets','profile','password'].includes(page))page='home';
 }
 if(Array.isArray(delta.events))cloud.events=delta.events;
 if(Array.isArray(delta.orders))cloud.orders=delta.orders;
 if(Array.isArray(delta.tickets))cloud.tickets=delta.tickets;
 if(Array.isArray(delta.favorites)&&session)favorites[session.id]=delta.favorites;
 shell();if(page==='detail')renderDetail();else render();
};
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();toggleMenu(false)}});shell();render();
</script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script defer src="tf-ticket-renderer.js"></script><script type="module" src="tf-user-cloud.js"></script></body></html>
