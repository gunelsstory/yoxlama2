  :rawPending&&uploaded?`<div class="tf-payment-confirmed">${ico('clock')}<div><b>Qəbz yoxlamaya göndərilib</b><p>Ödəniş bank hesabında təsdiqləndikdən sonra QR biletləriniz aktivləşəcək.</p></div></div>`
  :s==='Təsdiqlənib'?`<div class="tf-payment-confirmed tf-pay-success">${ico('check')}<div><b>Ödəniş təsdiqlənib</b><p>Elektron QR biletinizi aşağıdan aça bilərsiniz.</p></div></div>
   ${cloud.tickets.filter(t=>t.orderId===o.id).map(t=>`<div class="ticket-row tf-mini-ticket"><div class="grow"><b>${esc(t.ticketNumber||t.id)}</b><div class="muted tiny">${t.used?'Giriş edilib':'Elektron QR bilet aktivdir'}</div></div><button class="btn primary" type="button" onclick="openTicket('${esc(t.ticketNumber||t.id)}')">${ico('eye')} Bileti aç</button></div>`).join('')||'<p class="muted tiny">Bilet məlumatları yüklənir. Bir qədər sonra “Biletlərim” bölməsini yoxlayın.</p>'}`
  :`<p class="alert">Bu sifarişin statusu: ${esc(s)}. Yeni sifariş yaratmaq üçün tədbirlərə baxın.</p>`;
 showModal('Sifariş '+esc(o.id),`<div class="tf-order-heading"><span>${ico('shopping-bag')} SİFARİŞİN İZLƏNMƏSİ</span>${statusBadge(s)}</div>
 ${orderProgress(o)}
 <div class="checkout-grid tf-premium-order"><div class="card tf-order-main"><div class="eyebrow">Tədbir məlumatları</div><div class="ticket-row tf-checkout-event"><img src="${imageFor(e)}" onerror="this.onerror=null;this.src=window.TF_FALLBACK_POSTER" alt="${esc(e.name)}"><div><h3>${esc(e.name)}</h3><div class="muted tiny">${date(e)} · ${esc(e.time||'')}</div><div class="muted tiny">${esc(e.venue||'')}</div></div></div>
 <div class="tf-order-basic"><span>Bilet sayı <b>${o.qty}</b></span><span>Məbləğ <b>${money(o.amount)}</b></span></div>
 ${rawPending&&!uploaded?`<div class="tf-timer-row">${ico('clock')} <b id="countdown">Qalan vaxt: ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</b></div>`:''}
 ${paymentHtml}</div><div class="card tf-order-summary"><div class="eyebrow">Sifariş məlumatları</div><h3>Yekun</h3><div class="tf-order-detail-line"><span>Nömrə</span><b>${esc(o.id)}</b></div><div class="tf-order-detail-line"><span>Tarix</span><b>${new Date(o.createdAt).toLocaleString('az-AZ')}</b></div><div class="tf-order-detail-line"><span>Bilet sayı</span><b>${o.qty}</b></div><div class="divider"></div><div class="tf-order-total"><span>Ümumi</span><strong>${money(o.amount)}</strong></div>
 ${rawPending?`<button type="button" class="btn danger full tf-order-cancel" onclick="cancelOrder('${o.id}')">Sifarişi ləğv et</button>`:''}</div></div>`,true);
 document.getElementById('modal').classList.add('order-modal');
 if(rawPending&&!uploaded){clearInterval(modalTimer);modalTimer=setInterval(()=>{const x=document.getElementById('countdown');if(!x){clearInterval(modalTimer);return}const diff=Math.max(0,(o.expiresAt||0)-Date.now());x.textContent='Qalan vaxt: '+Math.floor(diff/60000)+':'+String(Math.floor(diff/1000)%60).padStart(2,'0');if(!diff){clearInterval(modalTimer);closeModal();navigate('orders');toast('Rezervasiya müddəti bitdi')}},1000)}
}
async function copyPaymentCard(){const value=window.TF?.cardNumber||'';if(!value)return toast('Ödəniş kartı hələ qeyd edilməyib');try{await navigator.clipboard.writeText(value);toast('Kart nömrəsi kopyalandı')}catch(e){toast('Kopyalama mümkün olmadı. Kart nömrəsini əl ilə seçin.')}}
function copyTicket(t){if(navigator.clipboard)navigator.clipboard.writeText(t);toast('Bilet identifikatoru kopyalandı')}async function cancelOrder(id){try{await window.TF.cancel(id);closeModal();navigate('orders');toast('Sifariş ləğv edildi')}catch(e){toast(window.TF.error(e))}}
async function submitReceipt(id){
 const file=document.getElementById('receiptInput')?.files?.[0];
 if(!file)return toast('Qəbz şəklini seçin');
 if(file.size>5*1024*1024)return toast('Qəbz faylı maksimum 5 MB ola bilər');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('JPG, PNG və ya WebP formatında qəbz seçin');
 const btn=document.querySelector('.tf-send-receipt');if(btn)btn.disabled=true;
 try{await window.TF.receipt(id,file);closeModal();navigate('orders');toast('Qəbz yoxlamaya göndərildi')}
 catch(e){if(btn)btn.disabled=false;toast(window.TF.error(e))}
}
function ownedTicket(ticketNumber){
 return cloud.tickets.find(t=>(t.ticketNumber||t.id)===ticketNumber && t.buyerUid===session?.id);
}
let previewTicketNumber=null;
async function openTicket(ticketNumber){
 if(!session)return openAuth('login');
 const t=ownedTicket(ticketNumber);if(!t){toast('Bilet tapılmadı və ya sizə aid deyil.');return;}
 if(ticketState(t).cls==='bad'){toast('Bu bilet etibarsızdır. QR kodunu istifadə etmək olmaz.');return;}
 if(!t.qrToken){toast('Bu bilet üçün QR kod yaradılmayıb.');return;}
 previewTicketNumber=t.ticketNumber||t.id;
 showModal('Elektron bilet · '+esc(previewTicketNumber),`<div class="tf-ticket-preview"><div class="alert" style="margin-bottom:12px">${ticketState(t).cls==='used'?'Bu bilet girişdə artıq istifadə edilib və yenidən keçərli deyil.':ticketState(t).usable?'Bu QR kodu yalnız tədbir girişində göstərin. QR yalnız bir dəfə keçərlidir.':'Biletin statusunu adminlə dəqiqləşdirin. Bu QR kod giriş hüququnu təsdiqləmir.'}</div><div id="tfUserTicketCanvas" class="tf-ticket-canvas">Bilet hazırlanır…</div><div class="tf-ticket-actions"><button class="btn primary" onclick="downloadTicket()">${ico('upload')} PNG yüklə</button><button class="btn" onclick="printTicket()">Çap et</button></div></div>`,false);
 try{
   if(!window.TFTicketRenderer)throw Error('Bilet renderer modulu yüklənməyib.');
   const canvas=await window.TFTicketRenderer.render(t,{template:window.TF?.ticketTemplate||'assets/ticket.jpg'});
   const target=document.getElementById('tfUserTicketCanvas');if(target)target.replaceChildren(canvas);
 }catch(e){const target=document.getElementById('tfUserTicketCanvas');if(target)target.textContent='Bilet hazırlana bilmədi: '+e.message;}
}
async function downloadTicket(){
 const can=document.querySelector('#tfUserTicketCanvas canvas');if(!can)return toast('Bilet hazırlanmayıb.');
 const blob=await new Promise(resolve=>can.toBlob(resolve,'image/png'));
 if(!blob)return toast('Şəkil hazırlana bilmədi.');
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=(previewTicketNumber||'bilet').replace(/[^a-zA-Z0-9_-]/g,'-')+'.png';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function printTicket(){
 const can=document.querySelector('#tfUserTicketCanvas canvas');if(!can)return toast('Bilet hazırlanmayıb.');
 const win=window.open('','_blank');if(!win)return toast('Çap pəncərəsinə icazə verin.');
 const img=can.toDataURL('image/png');
 win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Biletin çapı</title><style>body{margin:0;text-align:center}img{width:auto;max-width:100%;max-height:100vh}@media print{@page{margin:8mm}}</style></head><body><img src="'+img+'" onload="window.print()"></body></html>');
 win.document.close();
}
function showModal(h,body,wide=false){
 clearInterval(modalTimer);
 const el=document.getElementById('modal');
 el.className='modal'+(wide?' wide':'');
 el.innerHTML=`<div class="modal-head"><div class="tf-modal-titles"><span class="tf-modal-overline">TICKETFLOW / TƏHLÜKƏSİZ XİDMƏT</span><h2>${h}</h2></div><button type="button" class="iconbtn tf-modal-close" aria-label="Bağla" onclick="closeModal()">${ico('close')}</button></div>${body}`;
 document.getElementById('modalWrap').classList.add('show');
}
function closeModal(){clearInterval(modalTimer);document.getElementById('modalWrap').classList.remove('show')}
function openAuth(mode){
 const reg=mode==='register';
 showModal(reg?'Qeydiyyat':'Hesaba giriş',`<div class="tf-auth-shell">
  <div class="tf-auth-mark">${ico('shield')}</div><div class="tf-auth-intro"><span>TICKETFLOW HESABINIZ</span><h3>${reg?'Yeni hesab yaradın':'Yenidən xoş gəlmisiniz!'}</h3><p>${reg?'Biletlərinizi və sifarişlərinizi bir yerdən idarə edin.':'Sifarişlərinizi izləmək və biletlərinizi görmək üçün daxil olun.'}</p></div>
  <div class="tf-auth-tabs"><button type="button" class="${!reg?'active':''}" onclick="openAuth('login')">Daxil ol</button><button type="button" class="${reg?'active':''}" onclick="openAuth('register')">Qeydiyyat</button></div>
  <form id="authForm" class="tf-auth-form" onsubmit="authSubmit(event,'${mode}')">
  ${reg?'<div class="field"><label>Ad və soyad</label><input name="name" minlength="3" required autocomplete="name" placeholder="Adınız və soyadınız"></div>':''}
  <div class="field"><label>E-poçt ünvanı</label><input type="email" name="email" required autocomplete="email" placeholder="ad@example.com"></div>
  <div class="field"><label>Şifrə</label><div class="tf-auth-pass"><input type="password" name="password" minlength="6" required autocomplete="${reg?'new-password':'current-password'}" placeholder="Şifrənizi daxil edin"><button type="button" aria-label="Şifrəni göstər və ya gizlət" onclick="toggleAuthPassword(this)">${ico('eye')}</button></div></div>
  ${reg?'<div class="field"><label>Şifrəni təkrar yazın</label><input type="password" name="confirm" minlength="6" required autocomplete="new-password" placeholder="Şifrəni təsdiqləyin"></div>':''}
  ${!reg?'<div class="tf-auth-forgot"><button type="button" class="link" onclick="openResetPassword()">Şifrəni unutmusunuz?</button></div>':''}
  <button class="btn primary full tf-auth-submit" type="submit">${reg?'Hesab yarat':'Hesaba daxil ol'} ${ico('arrow')}</button>
  <p class="tf-auth-safe">${ico('shield')} Hesabınız Firebase Authentication ilə qorunur.</p>
  </form></div>`,false);
 document.getElementById('modal').classList.add('tf-auth-modal');
}
function toggleAuthPassword(button){const input=button.previousElementSibling;if(!input)return;input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'Şifrəni göstər':'Şifrəni gizlət')}
function openResetPassword(){showModal('Şifrə bərpası',`<div class="tf-auth-shell"><div class="tf-auth-mark">${ico('mail')}</div><p class="muted">Qeydiyyatda istifadə etdiyiniz e-poçt ünvanını yazın. Şifrə bərpası üçün məktub göndəriləcək.</p><form onsubmit="submitResetPassword(event)"><div class="field"><label>E-poçt ünvanı</label><input type="email" name="email" required autocomplete="email" placeholder="ad@example.com"></div><button type="submit" class="btn primary full">Bərpa məktubunu göndər ${ico('arrow')}</button></form><button type="button" class="link tf-auth-back" onclick="openAuth('login')">Girişə qayıt</button></div>`);document.getElementById('modal').classList.add('tf-auth-modal')}
async function submitResetPassword(ev){ev.preventDefault();const btn=ev.target.querySelector('button[type=submit]');btn.disabled=true;try{await window.TF.resetPassword(String(new FormData(ev.target).get('email')).trim());closeModal();toast('Şifrə bərpası üçün məktub göndərildi.')}catch(e){toast(window.TF.error(e));btn.disabled=false}}
async function authSubmit(ev,mode){ev.preventDefault();const submit=ev.target.querySelector('button[type=submit]');if(submit?.disabled)return;const f=new FormData(ev.target);if(mode==='register'&&f.get('password')!==f.get('confirm'))return toast('Şifrələr uyğun gəlmir');if(submit){submit.disabled=true;submit.dataset.prevText=submit.innerHTML;submit.textContent=mode==='register'?'Hesab yaradılır…':'Daxil olunur…'}try{const profile=await window.TF.login(mode,String(f.get('email')).trim(),String(f.get('password')),String(f.get('name')||'').trim());if(!profile?.id)throw Error('Giriş uğurlu görünsə də istifadəçi məlumatları alınmadı. Yenilənmiş tf-user-cloud.js faylını yoxlayın.');window.TFUserUpdate({profile});closeModal();navigate('dashboard');toast('Xoş gəlmisiniz!')}catch(e){toast(window.TF?.error?.(e)||e.message||String(e))}finally{if(submit?.isConnected){submit.disabled=false;submit.innerHTML=submit.dataset.prevText||submit.innerHTML}}}
function requestPasswordReset(){openResetPassword()}
async function handleLogout(){if(!session)return openAuth('login');await window.TF.logout();navigate('home')}
async function saveProfile(ev){ev.preventDefault();try{await window.TF.profile(Object.fromEntries(new FormData(ev.target)));toast('Məlumatlar yeniləndi')}catch(e){toast(window.TF.error(e))}}
async function changePassword(ev){ev.preventDefault();let f=new FormData(ev.target);if(f.get('new')!==f.get('confirm'))return toast('Şifrələr uyğun gəlmir');try{await window.TF.password(f.get('old'),f.get('new'));ev.target.reset();toast('Şifrə yeniləndi')}catch(e){toast(window.TF.error(e))}}
window.TFUserUpdate=function(delta){
 if(Object.prototype.hasOwnProperty.call(delta,'profile')){
   users=delta.profile?[delta.profile]:[];
   session=delta.profile?{id:delta.profile.id}:null;
   if(!session&&['dashboard','orders','tickets','profile','password','notifications'].includes(page))page='home';
 }
 if(Array.isArray(delta.events))cloud.events=delta.events;
 if(Array.isArray(delta.orders))cloud.orders=delta.orders;
 if(Array.isArray(delta.tickets))cloud.tickets=delta.tickets;
 if(Array.isArray(delta.favorites)&&session)favorites[session.id]=delta.favorites;
 shell();if(page==='detail')renderDetail();else render();tfOpenSharedEvent();
};
window.addEventListener('hashchange',tfOpenSharedEvent);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();toggleMenu(false)}});shell();render();
</script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script defer src="tf-ticket-renderer.js"></script><script type="module" src="tf-user-cloud.js?v=tf-auth-v4-20261023"></script></body></html>
